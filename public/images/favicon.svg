<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 48 424 424" role="img" aria-labelledby="title desc">
  <title id="title">Hello World Cards globe ball logo mark</title>
  <desc id="desc">A cute globe-inspired ball mark with a central band and button.</desc>
  <defs>
    <clipPath id="ballClip">
      <circle cx="260" cy="260" r="190"/>
    </clipPath>
  </defs>
  <g id="mark">
    <circle cx="260" cy="260" r="190" fill="#ffffff" stroke="#171717" stroke-width="22"/>

    <g clip-path="url(#ballClip)">
      <rect x="55" y="55" width="410" height="205" fill="#68C7E8"/>
      <rect x="55" y="260" width="410" height="205" fill="#F7FBFD"/>

      <!-- simplified continents -->
      <g fill="#78D68B">
        <path d="M115 122c28-30 68-43 110-35 15 3 29 9 41 18l-18 19-3 24-26 10-20 31-31-1-17 20-28-9-17-26 9-31z"/>
        <path d="M231 109l31-10 33 11 9 19-14 18-22 4-15-14-21 1-15-12z"/>
        <path d="M311 131l43-10 40 16 19 24-13 18-27-3-12 23-25 5-11-21-18-4-8-22z"/>
        <path d="M347 333l23-11 27 8 18 21-11 23-20 8-22-9-14-19z"/>
        <path d="M141 319l22-11 28 9 13 23-11 19-26 6-22-12-13-19z"/>
      </g>

      <!-- latitude / longitude cues -->
      <g fill="none" stroke="#2A7F9B" stroke-width="6" opacity="0.7">
        <path d="M92 198c76 34 260 34 336 0"/>
        <path d="M102 154c88 30 228 30 316 0"/>
        <path d="M260 75c-46 58-65 126-57 185"/>
        <path d="M260 75c46 58 65 126 57 185"/>
      </g>
    </g>

    <!-- central band -->
    <rect x="70" y="239" width="380" height="42" rx="21" fill="#171717"/>
    <circle cx="260" cy="260" r="52" fill="#ffffff" stroke="#171717" stroke-width="18"/>
    <circle cx="260" cy="260" r="18" fill="#68C7E8" stroke="#171717" stroke-width="7"/>
  </g>
</svg>
